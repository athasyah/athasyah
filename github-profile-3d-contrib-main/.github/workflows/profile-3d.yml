name: Generate 3D Contribution

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # setiap hari jam 00:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Generate 3D GitHub Profile
        uses: yoshi389111/github-profile-3d-contrib@0.6.1
        with:
          user_name: athasyah  
          theme: "GitHub"     

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          git commit -m "Generate 3D GitHub profile contribution"
          git push
